name: Build SignalScope APK (no tests)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35 and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK without running tests
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare downloadable APK and checksum
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SignalScope-v0.1.0-debug.apk
          ( cd release && sha256sum SignalScope-v0.1.0-debug.apk > SHA256SUMS.txt )
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalScope-v0.1.0-debug-APK
          path: |
            release/SignalScope-v0.1.0-debug.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
